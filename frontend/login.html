<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F5F7FA">
  <title>登录 - 启明智能陪护管理平台</title>
  <link rel="stylesheet" href="/brand.css">
  <link rel="stylesheet" href="/login-theme.css">
  <style>
    /* finesse · register=product · shell=split-auth · palette=blue-gray-silver-cyan */
    @media (prefers-reduced-motion: reduce) {
      .login-card, .spinner { animation: none !important; transition: none !important; }
      .login-card.switch-out, .login-card.switch-in { opacity: 1; transform: none; }
    }
  </style>
  <script src="login-config.js"></script>
  <script src="login.js" defer></script>
  <script src="/live-preview.js" defer></script>
</head>
<body>
  <svg class="auth-icon-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="auth-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20v-2a7 7 0 0 1 14 0v2"></path></symbol>
      <symbol id="auth-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="11" rx="2"></rect><path d="M8 10V6a4 4 0 0 1 8 0v4M12 14.5v2.5"></path></symbol>
      <symbol id="auth-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></symbol>
      <symbol id="auth-code" viewBox="0 0 24 24"><path d="m12 2 8 3v6c0 5-4.5 9-8 11-3.5-2-8-6-8-11V5l8-3Z"></path><path d="m8.5 12 2.5 2.5 4.5-5"></path></symbol>
      <symbol id="auth-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></symbol>
    </defs>
  </svg>
  <main class="login-shell">
    <section class="brand" aria-label="启明帽平台介绍">
      <div class="brand-background" aria-hidden="true"><img class="brand-portrait" src="/assets/qiming-assistive-user.webp" alt="" width="1200" height="1500" loading="lazy" decoding="async"></div>
      <div class="brand-lockup brand-lockup--login"><div class="brand-mark" aria-hidden="true"><span>✦</span></div><div class="brand-copy"><strong>启明智能陪护</strong><span>管理平台</span></div></div>
      <div class="brand-main">
        <div class="eyebrow">QIMING HAT · ASSISTIVE CARE</div>
        <h1>让每一步出行<br>都更<span class="headline-glow">安心</span></h1>
        <p class="slogan">智能视觉陪护，守护出行安全</p>
      </div>
      <div class="brand-foot">多设备统一管理 · 实时环境感知 · 全链路安全预警</div>
    </section>
    <section class="auth-side">
      <form id="loginForm" class="login-card" novalidate>
        <h2 class="login-title">欢迎登录</h2><p class="login-subtitle">启明智能陪护管理平台</p>
        <div id="loginError" class="error-banner" role="alert" hidden></div>
        <div class="field" id="usernameField"><label for="username">账号</label><div class="input-wrap"><span class="field-icon" aria-hidden="true"><svg class="auth-icon"><use href="#auth-user"></use></svg></span><input id="username" name="username" autocomplete="username" placeholder="请输入账号" required maxlength="80"></div><div class="field-error" id="usernameError"></div></div>
        <div class="field" id="passwordField"><label for="password">密码</label><div class="input-wrap"><span class="field-icon" aria-hidden="true"><svg class="auth-icon"><use href="#auth-lock"></use></svg></span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required maxlength="200"><button id="togglePassword" class="icon-button" type="button" aria-label="显示密码" aria-pressed="false" title="显示密码"><svg class="auth-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#auth-eye"></use><path class="eye-slash" d="m3 3 18 18"></path></svg></button></div><div class="field-error" id="passwordError"></div></div>
        <div class="field" id="captchaField"><label for="captcha">图形验证码</label><div class="captcha-row"><div class="input-wrap"><span class="field-icon" aria-hidden="true"><svg class="auth-icon"><use href="#auth-code"></use></svg></span><input id="captcha" name="captcha" autocomplete="off" placeholder="输入验证码" required maxlength="8"></div><img id="captchaImage" class="captcha-image" alt="点击刷新验证码" title="点击刷新验证码" tabindex="0"></div><div class="field-error" id="captchaError"></div></div>
        <div class="assist"><label class="remember"><input id="remember" type="checkbox"><span>记住密码</span></label><button id="forgot" class="text-link" type="button">忘记密码？</button></div>
        <button id="submitButton" class="submit" type="submit">登 录</button>
        <p class="register-prompt">还没有账号？ <button class="text-link" type="button" data-mode="register">立即注册</button></p>
        <p class="security"><span class="security-mark" aria-hidden="true">●</span>仅限授权人员使用，请勿泄露账号密码</p>
        <p class="copyright">© 2026 启明智能陪护管理平台 版权所有</p>
      </form>
      <form id="registerForm" class="login-card register-card" novalidate hidden>
        <h2 class="login-title">注册账号</h2><p class="login-subtitle">启明智能陪护管理平台</p>
        <div id="registerError" class="error-banner" role="alert" hidden></div>
        <div class="field" id="registerUsernameField"><label for="registerUsername">账号</label><div class="input-wrap"><span class="field-icon" aria-hidden="true"><svg class="auth-icon"><use href="#auth-user"></use></svg></span><input id="registerUsername" autocomplete="username" placeholder="请设置登录账号" maxlength="20"></div><div class="field-hint">4-20位字母、数字组合</div><div class="field-error" id="registerUsernameError"></div></div>
        <div class="field" id="registerEmailField"><label for="registerEmail">联系邮箱</label><div class="input-wrap"><span class="field-icon" aria-hidden="true"><svg class="auth-icon"><use href="#auth-mail"></use></svg></span><input id="registerEmail" type="email" autocomplete="email" placeholder="请输入邮箱地址" maxlength="200"></div><div class="field-error" id="registerEmailError"></div></div>
        <div class="field" id="registerPasswordField"><label for="registerPassword">设置密码</label><div class="input-wrap"><span class="field-icon" aria-hidden="true"><svg class="auth-icon"><use href="#auth-lock"></use></svg></span><input id="registerPassword" type="password" autocomplete="new-password" placeholder="请设置登录密码" maxlength="20"><button class="icon-button" type="button" data-toggle-password="registerPassword" aria-label="显示密码" aria-pressed="false"><svg class="auth-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#auth-eye"></use><path class="eye-slash" d="m3 3 18 18"></path></svg></button></div><div class="field-hint">6-20位，需包含字母与数字</div><div class="field-error" id="registerPasswordError"></div></div>
        <div class="field" id="registerConfirmField"><label for="registerConfirm">确认密码</label><div class="input-wrap"><span class="field-icon" aria-hidden="true"><svg class="auth-icon"><use href="#auth-lock"></use></svg></span><input id="registerConfirm" type="password" autocomplete="new-password" placeholder="请再次输入密码" maxlength="20"></div><div class="field-error" id="registerConfirmError"></div></div>
        <div class="field" id="registerCaptchaField"><label for="registerCaptcha">图形验证码</label><div class="captcha-row"><div class="input-wrap"><span class="field-icon" aria-hidden="true"><svg class="auth-icon"><use href="#auth-code"></use></svg></span><input id="registerCaptcha" autocomplete="off" placeholder="输入验证码" maxlength="8"></div><img id="registerCaptchaImage" class="captcha-image" alt="点击刷新验证码" title="点击刷新验证码" tabindex="0"></div><div class="field-error" id="registerCaptchaError"></div></div>
        <label class="terms-row"><input id="registerTerms" type="checkbox"><span>我已阅读并同意<button type="button" class="text-link" data-policy="terms">《用户服务协议》</button>和<button type="button" class="text-link" data-policy="privacy">《隐私政策》</button></span></label>
        <button id="registerSubmit" class="submit" type="submit" disabled>注 册</button>
        <p class="register-prompt">已有账号？ <button class="text-link" type="button" data-mode="login">返回登录</button></p>
        <p class="security"><span class="security-mark" aria-hidden="true">●</span>仅限授权人员使用，请勿泄露账号密码</p>
        <p class="copyright">© 2026 启明智能陪护管理平台 版权所有</p>
      </form>
    </section>
  </main>
  <dialog id="registerSuccess" class="message-dialog"><div class="success-mark">✓</div><h2>注册成功</h2><p>即将返回登录页</p><strong id="redirectCountdown">3</strong></dialog>
  <dialog id="policyDialog" class="message-dialog policy-dialog"><h2 id="policyTitle"></h2><p id="policyContent"></p><button class="submit" type="button" data-close-policy>知道了</button></dialog>
</body>
</html>
